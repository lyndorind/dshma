name: Create Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths-ignore:
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check if tag already exists
        id: tag_check
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${VERSION} already exists. Release creation will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${VERSION} does not exist."
          fi

      - name: Read release notes from CHANGELOG
        if: steps.tag_check.outputs.exists == 'false'
        id: changelog
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES=$(awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "No release notes found for version $VERSION"
            exit 1
          fi

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build package
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Generate SHA-256 checksum
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          sha256sum dist/*.tgz > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Create tag and GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: ./.github/actions/create-release
        with:
          version: ${{ steps.version.outputs.version }}
          release-notes: ${{ steps.changelog.outputs.notes }}

      - name: Upload assets to GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "v${VERSION}" \
            dist/*.tgz \
            dist/SHA256SUMS.txt
name: PR Build

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  build-package:
    name: build-package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload coverage reports to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          slug: lyndorind/dshma
          fail_ci_if_error: true

      - name: SonarQube Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Snyk security scan
        if: github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # ---------------- DOCKER BUILD ----------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for PR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: dshma:pr-${{ github.event.pull_request.number }}-${{ github.sha }}

      # ---------------- PACKAGE BUILD ----------------

      - name: Build package
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Generate SHA-256 checksum
        run: |
          sha256sum dist/*.tgz > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload package and checksum
        uses: actions/upload-artifact@v7
        with:
          name: package-and-sha256
          path: |
            dist/*.tgz
            dist/SHA256SUMS.txt
          if-no-files-found: error
      

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dshma
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dshma"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Start application
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: dshma
        run: |
          npm start > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if grep -q "Database initialized" app.log && curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 1
          done

          echo "Application failed to start"
          cat app.log
          exit 1

      - name: Run Postman integration tests
        run: |
          mkdir -p reports
          npx newman run postman/dshma-integration.postman_collection.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export reports/postman-report.html

      - name: Upload Postman HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postman-integration-report
          path: reports/postman-report.html
          if-no-files-found: warn
name: Manual Container Security Scan

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Docker image version to scan"
        required: true
        default: "1.1.2"
        type: string

permissions:
  contents: read
  security-events: write

env:
  IMAGE: quay.io/lyndorind/dshma:${{ inputs.image_version }}

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ---------------- TRIVY ----------------

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-manual-${{ inputs.image_version }}

      # ---------------- SNYK ----------------

      - name: Scan image with Snyk
        continue-on-error: true
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE }}
          args: --file=Dockerfile --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF
        if: always() && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif
          category: snyk-manual-${{ inputs.image_version }}

      # ---------------- GRYPE ----------------

      - name: Scan image with Grype
        id: grype
        uses: anchore/scan-action@v7.4.2
        with:
          image: ${{ env.IMAGE }}
          fail-build: false
          output-format: sarif

      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-manual-${{ inputs.image_version }}